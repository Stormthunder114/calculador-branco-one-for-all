<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One For All - Calculadora</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #1be0ac; /* Verde Turquesa */
      --primary-hover: #17c497;
      --secondary-color: #343a40; /* Cinza escuro */
      --secondary-hover: #23272b;
      --danger-color: #dc3545;
      --danger-hover: #c82333;
      --success-color: #198754; /* Verde mais escuro */
      --success-hover: #157347;
      --warning-color: #ffc107;
      --warning-hover: #e0a800;
      --light-bg: #f8f9fa;
      --dark-bg: #212529;
      --border-color: #ced4da;
      --text-color: #212529;
      --text-muted: #6c757d;
      --white: #ffffff;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.1);
      --border-radius: 0.375rem; /* 6px */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #e9ecef; /* Fundo ligeiramente cinza */
      color: var(--text-color);
      line-height: 1.6;
      padding: 1rem;
    }

    h1, h2, h3, h4 {
      margin-bottom: 1rem;
      line-height: 1.3;
      font-weight: 600;
    }

    h1 {
      font-size: 1.75rem;
      text-align: center;
      margin: 1rem 0 1.5rem;
      color: var(--primary-color);
      font-weight: 700;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 1.5rem;
      }
    }

    .container {
      max-width: 650px;
      margin: 1rem auto;
      padding: 1.5rem;
      background-color: var(--white);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow-md);
    }

    label {
      display: block;
      margin-top: 1rem;
      margin-bottom: 0.25rem;
      font-weight: 500;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    input, button, select {
      padding: 0.75rem 1rem;
      margin-bottom: 0.75rem;
      width: 100%;
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(27, 224, 172, 0.2);
    }

    input[type="number"] {
      -moz-appearance: textfield;
    }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    button {
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.2s, transform 0.1s;
      border: none;
      color: var(--white);
    }
    
    button:active {
        transform: scale(0.98);
    }

    button.primary {
      background-color: var(--primary-color);
    }

    button.primary:hover {
      background-color: var(--primary-hover);
    }

    button.secondary {
      background-color: var(--secondary-color);
    }

    button.secondary:hover {
      background-color: var(--secondary-hover);
    }

    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    @media (max-width: 480px) {
      .button-group {
        grid-template-columns: 1fr;
      }
    }

    .result {
      margin-top: 2rem;
      border-top: 1px solid var(--border-color);
      padding-top: 1.5rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
      font-size: 0.95rem;
      box-shadow: var(--shadow-sm);
      border-radius: var(--border-radius);
      overflow: hidden; /* Para o border-radius funcionar com a tabela */
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 0.75rem 1rem;
      text-align: left;
    }

    th {
      background-color: var(--light-bg);
      font-weight: 600;
      color: var(--secondary-color);
    }
    
    td {
        background-color: var(--white);
    }

    tr:nth-child(even) td {
      background-color: var(--light-bg);
    }

    .highlight {
      font-weight: 700;
      color: var(--primary-color);
    }

    .error {
      color: var(--danger-color);
      font-size: 0.8rem;
      margin-top: -0.5rem;
      margin-bottom: 0.75rem;
    }

    .calculo-adicional {
      background-color: var(--light-bg);
      padding: 1rem 1.5rem;
      border-radius: var(--border-radius);
      margin-top: 1rem;
      border: 1px solid var(--border-color);
    }

    .calculo-adicional h3 {
      margin-top: 0;
      font-size: 1.1rem;
      margin-bottom: 0.75rem;
      color: var(--secondary-color);
    }

    .calculo-adicional p {
      margin: 0.5rem 0;
      font-size: 0.95rem;
    }

    /* Estilos para dispositivos móveis */
    @media (max-width: 768px) {
      body {
        padding: 0.5rem;
      }
      
      .container {
        padding: 1rem;
        margin: 0.5rem auto;
        box-shadow: var(--shadow-sm);
      }
      
      input, button, select {
        padding: 0.65rem 0.9rem;
        font-size: 1rem; /* Mantém 16px para evitar zoom */
      }
      
      table {
        font-size: 0.9rem;
      }
      
      th, td {
        padding: 0.6rem 0.8rem;
      }
    }

    /* Estilos para telas muito pequenas */
    @media (max-width: 360px) {
      h1 {
        font-size: 1.3rem;
      }
      
      label, input, button, select {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>One For All - Calculadora</h1>

    <label for="branco">Horário do Branco (hh:mm):</label>
    <input type="time" id="branco" required>
    <div id="branco-error" class="error"></div>

    <label for="antes1">Número antes 1:</label>
    <input type="number" id="antes1" min="0" inputmode="numeric" placeholder="Ex: 5">

    <label for="antes2">Número antes 2:</label>
    <input type="number" id="antes2" min="0" inputmode="numeric" placeholder="Ex: 10">

    <label for="depois1">Número depois 1:</label>
    <input type="number" id="depois1" min="0" inputmode="numeric" placeholder="Ex: 3">

    <label for="depois2">Número depois 2:</label>
    <input type="number" id="depois2" min="0" inputmode="numeric" placeholder="Ex: 8">

    <button onclick="calcular()" class="primary">Calcular Horários</button>
    
    <div class="button-group">
      <button onclick="limparCampos()" class="secondary">Limpar Campos</button>
      <button onclick="verHistorico()" class="secondary">Ver Histórico</button>
    </div>

    <div class="result" id="resultado" style="display: none;">
      <h2>Resultados</h2>
      <table id="resultadoTabela">
        <thead>
          <tr>
            <th>Tipo</th>
            <th>Horário Calculado</th>
          </tr>
        </thead>
        <tbody>
          <!-- Resultados serão inseridos aqui -->
        </tbody>
      </table>
      <div id="calculoAdicional" class="calculo-adicional">
        <!-- Cálculo adicional será inserido aqui -->
      </div>
    </div>

  </div>

  <script>
    // Variáveis globais para armazenar os horários calculados
    let horariosCalculados = [];
    let ultimoCalculo = null; // Para salvar no histórico

    function validarEntradas() {
      let valido = true;
      const brancoInput = document.getElementById("branco");
      const brancoError = document.getElementById("branco-error");

      brancoError.textContent = ""; // Limpa erro anterior

      if (!brancoInput.value) {
        brancoError.textContent = "Por favor, insira o horário do branco.";
        valido = false;
      }

      // Adicionar mais validações se necessário (ex: para os números)

      return valido;
    }

    function calcular() {
      if (!validarEntradas()) {
        return;
      }

      const branco = document.getElementById("branco").value;
      const antes1 = parseInt(document.getElementById("antes1").value) || 0;
      const antes2 = parseInt(document.getElementById("antes2").value) || 0;
      const depois1 = parseInt(document.getElementById("depois1").value) || 0;
      const depois2 = parseInt(document.getElementById("depois2").value) || 0;

      const [horaStr, minutoStr] = branco.split(":");
      const hora = parseInt(horaStr);
      const minuto = parseInt(minutoStr);

      // --- Cálculo da soma dos dígitos + minuto ---
      let somaDigitos = 0;
      for (const digito of horaStr + minutoStr) {
        if (!isNaN(parseInt(digito))) {
          somaDigitos += parseInt(digito);
        }
      }
      const resultadoSomaMinuto = somaDigitos + minuto;
      // --- Fim do cálculo adicional ---

      const resultados = [];
      const somasAntes = [antes1, antes2, antes1 + antes2];
      const somasDepois = [depois1, depois2, depois1 + depois2];

      // Limpar a lista de horários calculados
      horariosCalculados = [];

      somasAntes.forEach(soma => {
        if (soma > 0) { // Só adiciona se a soma for relevante
            const horarioCalculado = adicionarMinutos(hora, minuto, soma);
            resultados.push({ tipo: `Antes (${soma})`, valor: horarioCalculado });
            horariosCalculados.push(horarioCalculado);
        }
      });

      somasDepois.forEach(soma => {
         if (soma > 0) { // Só adiciona se a soma for relevante
            const horarioCalculado = adicionarMinutos(hora, minuto, soma);
            resultados.push({ tipo: `Depois (${soma})`, valor: horarioCalculado });
            horariosCalculados.push(horarioCalculado);
         }
      });

      const resultadoDiv = document.getElementById("resultado");
      const tabelaBody = document.querySelector("#resultadoTabela tbody");
      const calculoAdicionalDiv = document.getElementById("calculoAdicional");
      tabelaBody.innerHTML = ""; // Limpa resultados anteriores da tabela
      calculoAdicionalDiv.innerHTML = ""; // Limpa cálculo adicional anterior

      // Popula a tabela
      if (resultados.length > 0) {
          resultados.forEach(res => {
            const row = tabelaBody.insertRow();
            const cellTipo = row.insertCell();
            const cellValor = row.insertCell();
            cellTipo.textContent = res.tipo;
            cellValor.textContent = res.valor;
          });
          resultadoDiv.style.display = "block";
      } else {
          resultadoDiv.style.display = "none";
      }

      // Exibe o cálculo adicional
      calculoAdicionalDiv.innerHTML = `
        <h3>Cálculo Adicional</h3>
        <p>Horário Base: ${horaStr}:${minutoStr}</p>
        <p>Soma dos dígitos (${horaStr.split("").join("+")}+${minutoStr.split("").join("+")}): ${somaDigitos}</p>
        <p>Resultado (Soma Dígitos + Minuto): ${somaDigitos} + ${minuto} = <span class="highlight">${resultadoSomaMinuto}</span></p>
      `;

      // Prepara para salvar no histórico
      ultimoCalculo = { 
        branco, 
        antes1, 
        antes2, 
        depois1, 
        depois2, 
        resultados, 
        calculoAdicional: { 
          somaDigitos, 
          minuto, 
          resultadoSomaMinuto 
        }
      };
      
      salvarHistorico(ultimoCalculo);
    }

    function adicionarMinutos(hora, minuto, soma) {
      let novoMinuto = minuto + soma;
      let novaHora = hora;
      novaHora += Math.floor(novoMinuto / 60);
      novoMinuto = novoMinuto % 60;
      novaHora = novaHora % 24;
      const h = novaHora.toString().padStart(2, "0");
      const m = novoMinuto.toString().padStart(2, "0");
      return `${h}:${m}`;
    }

    function limparCampos() {
      document.getElementById("branco").value = "";
      document.getElementById("antes1").value = "";
      document.getElementById("antes2").value = "";
      document.getElementById("depois1").value = "";
      document.getElementById("depois2").value = "";
      document.getElementById("resultado").style.display = "none";
      document.querySelector("#resultadoTabela tbody").innerHTML = "";
      document.getElementById("calculoAdicional").innerHTML = "";
      document.getElementById("branco-error").textContent = "";
      
      // Limpar a lista de horários calculados e último cálculo
      horariosCalculados = [];
      ultimoCalculo = null;
    }

    function verHistorico() {
      window.location.href = "historico_one_for_all.html"; // Atualizado para o novo nome
    }

    function salvarHistorico(calculo) {
        let historico = JSON.parse(localStorage.getItem('historicoCalculosOneForAll')) || [];
        
        // Se é um novo cálculo, adiciona timestamp e insere
        if (!calculo.timestamp) {
            calculo.timestamp = new Date().toLocaleString('pt-BR');
            historico.unshift(calculo); // Adiciona no início
        } else {
            // Se já tem timestamp, é uma atualização (improvável neste caso, mas mantém a lógica)
            const index = historico.findIndex(item => item.timestamp === calculo.timestamp);
            if (index !== -1) {
                historico[index] = calculo;
            } else {
                 historico.unshift(calculo);
            }
        }
        
        if (historico.length > 50) { // Limita o histórico aos últimos 50 cálculos
            historico.pop();
        }
        localStorage.setItem('historicoCalculosOneForAll', JSON.stringify(historico));
    }

    // Limpa os resultados ao carregar a página inicialmente
    document.addEventListener('DOMContentLoaded', (event) => {
        limparCampos();
    });
  </script>
</body>
</html>
